# Compose project name → prefixes the network and named volumes
# (coomander_default, coomander_node_modules, coomander_caddy_state).
# Pinned so it doesn't derive from the folder name (still "maddiehq" for now).
name: coomander

services:
  # ── Caddy + Tailscale sidecar ───────────────────────────────────────────
  # Joins the tailnet as ${TS_HOSTNAME}, gets a real HTTPS cert from
  # Tailscale, and reverse-proxies to next dev on the shared network
  # namespace. Apple HSTS-preloads *.ts.net so iOS Safari requires real
  # HTTPS — this is the only path that works for phone QA.
  caddy-dev:
    image: ghcr.io/tailscale/caddy-tailscale:main
    container_name: coomander-caddy-dev
    hostname: ${TS_HOSTNAME:-coomander}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-coomander}
      # Bypass OrbStack's HTTP proxy for tsnet → controlplane traffic.
      # Without this, the proxy can re-emit the registration CONNECT and
      # tsnet creates a duplicate device (one canonical + one `-N` orphan).
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    volumes:
      - ./tailscale/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_state:/config
    ports:
      - "${DEV_PORT:-3005}:3000"
    restart: unless-stopped

  # ── Next.js dev ─────────────────────────────────────────────────────────
  # Shares caddy-dev's network namespace. localhost:${DEV_PORT} hits next
  # dev via the sidecar's host port mapping; the tailnet URL hits next dev
  # via Caddy's HTTPS reverse proxy on the tailnet interface. Same
  # container serves both. Full dev mode (hot reload, HMR) on both paths.
  app-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: coomander-dev
    network_mode: service:caddy-dev
    depends_on:
      - caddy-dev
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/core:/app/packages/core
      # tsconfig.base.json is extended by apps/web/tsconfig.json; Turbopack 500s without it.
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      # Named volumes so npm-installed deps survive `docker compose down/up`.
      # Populated from the image on first create. To refresh after a
      # package.json change: `docker compose run --rm app-dev npm install`.
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - ./apps/web/data:/app/apps/web/data
    env_file: ./apps/web/.env.local
    environment:
      NODE_ENV: development
      DATABASE_PATH: /app/apps/web/data/coomander.db
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3005}
      APP_URL: ${APP_URL:-http://localhost:3005}
      WATCHPACK_POLLING: "true"
    restart: unless-stopped

  # ── Agents Worker (Cloudflare Agents SDK sidecar, #192) ──────────────────
  # Runs `wrangler dev` (workerd/miniflare) so the AppAgent Durable Object,
  # alarms, and the streaming WebSocket chat all work locally. Shares
  # caddy-dev's network namespace; Caddy routes /agents/* → here (port 8788)
  # while everything else goes to next dev (port 3000). The agent reads/writes
  # only through the apps/web API — it has NO D1 binding.
  agents-dev:
    build:
      # Context is the repo root so the hoisted workspace lockfile is visible.
      context: .
      dockerfile: apps/agents/Dockerfile.dev
    container_name: coomander-agents
    network_mode: service:caddy-dev
    depends_on:
      - caddy-dev
    # wrangler dev assumes an interactive terminal for its hotkey UI and
    # crashes with `write EPIPE` without one.
    tty: true
    stdin_open: true
    volumes:
      - ./apps/agents:/app/apps/agents
      # The agents chat engine imports the shared model catalog from
      # @coomander/core (#203). The image's `npm ci` creates the workspace
      # symlink (node_modules/@coomander/core -> ../packages/core), so the
      # packages/core SOURCE must be mounted for wrangler's bundler to resolve
      # it at runtime — without this the worker fails with
      # `Could not resolve "@coomander/core"`.
      - ./packages/core:/app/packages/core
      # scripts/dev.sh builds wrangler's --env-file list from whichever of
      # ../web/.env(.local) and .dev.vars exist — the web env file carries
      # ANTHROPIC_API_KEY (same key the POST chat path uses); .dev.vars carries
      # AGENTS_INTERNAL_SECRET.
      - ./apps/web/.env.local:/app/apps/web/.env.local:ro
      # Two named volumes, mirroring the web service:
      #  - root holds any hoisted deps;
      #  - LOCAL holds apps/agents/node_modules where npm installs wrangler +
      #    agents (not hoisted). Without it the ./apps/agents bind mount shadows
      #    the image's workspace-local node_modules and wrangler never binds 8788.
      # Refresh after a package.json change:
      # `docker compose run --rm agents-dev npm ci`.
      - agents_node_modules:/app/node_modules
      - agents_local_node_modules:/app/apps/agents/node_modules
    environment:
      NODE_ENV: development
      # Keep Docker chat available with only ANTHROPIC_API_KEY configured.
      # Set false when intentionally testing the remote Workers AI binding.
      COOMANDER_AGENTS_LOCAL_ONLY: ${COOMANDER_AGENTS_LOCAL_ONLY:-true}
    restart: unless-stopped

  # ── Cloudflare Tunnel (opt-in: Telegram webhook in dev, #215) ────────────
  # Telegram inbound is webhook-based and Telegram allows ONE webhook per bot,
  # so each developer runs their OWN dev bot + their OWN named tunnel (prod's
  # @coomander_bot owns the coomander.com webhook). This sidecar connects a
  # Cloudflare *named* tunnel that publishes a stable public hostname
  # (e.g. https://dev-<you>.coomander.com) so Telegram's servers can reach this
  # machine's /api/coomander/webhook. Scope the tunnel's ingress to ONLY that
  # path in the Cloudflare Zero Trust dashboard so the rest of the dev app stays
  # private. See README → "Local Telegram dev".
  #
  # Opt-in: `docker compose --profile telegram up`. Plain `docker compose up`
  # does NOT start it (no token needed for normal dev). Shares caddy-dev's netns
  # so the tunnel's service target `http://localhost:3000` reaches next dev.
  # cloudflared reads the token from TUNNEL_TOKEN natively; set
  # CLOUDFLARE_TUNNEL_TOKEN in the repo-root .env (compose interpolation source).
  cloudflared:
    profiles: ["telegram"]
    image: cloudflare/cloudflared:2026.6.1
    container_name: coomander-cloudflared
    network_mode: service:caddy-dev
    depends_on:
      - caddy-dev
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # Bypass OrbStack's HTTP proxy for tunnel egress (mirrors caddy-dev).
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    command: tunnel --no-autoupdate run
    restart: unless-stopped

volumes:
  root_node_modules:
  web_node_modules:
  agents_node_modules:
  agents_local_node_modules:
  caddy_state:
