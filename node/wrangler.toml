# Cloudflare Workers configuration for Coomander (Node.js stack).
#
# Bindings use placeholder IDs — the first real deploy will replace them
# with values from `wrangler d1 create` / `wrangler r2 bucket create`.

name = "coomander"
# Custom Worker entrypoint (#151): wraps .open-next/worker.js to add the
# Coomander cron `scheduled()` handler. See custom-worker.ts.
main = "custom-worker.ts"

# Custom domain — Cloudflare provisions the cert on deploy.
# Requires oqodo.com to be on this Cloudflare account.
routes = [
  { pattern = "coomander.com", custom_domain = true }
]

# 2024-09-23 is the earliest compat date that ships the `nodejs_compat` flag
# behavior the audit (#287) expects. Pin a date older than the SDKs we use
# (Stripe, Resend, Anthropic) all advertise Workers support against.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by `opennextjs-cloudflare build`.
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ── Coomander cron (#151) ──────────────────────────────────────────────────
# IMPORTANT (§9.4 gotcha): this [triggers] table — like every other [table]
# header below — MUST stay BELOW all top-level scalars (name, main,
# compatibility_*, assets, routes). A table header placed above them silently
# absorbs the scalars that follow it. Validate with `wrangler deploy --dry-run`.
#
# Tight-preset cadence (UTC). custom-worker.ts maps each cron expression to a
# slot; the run route fans out to opted-in users and applies each user's nag
# preset (planPing) internally. Times are the tight-preset local intent for US
# Central translated to UTC (morning ~07:00, midday ~13:00, check ~16:00,
# evening ~20:00 CT); they drift ~1h across DST until per-user local scheduling
# lands. Keep in sync with custom-worker.ts CRON_SLOT and scheduling.ts.
# Daily slots + the Sunday-evening weekly review ("0 1 * * 1" = Mon 01:00 UTC =
# Sun 8pm CT; custom-worker.ts routes it to /api/coomander/weekly-review).
[triggers]
crons = ["0 12 * * *", "0 18 * * *", "0 21 * * *", "0 1 * * *", "0 1 * * 1"]

# Plain env vars (non-secret). Secrets go through `wrangler secret put`.
[vars]
DATABASE_DRIVER = "d1"
APP_NAME = "Coomander"
BETTER_AUTH_URL = "https://coomander.com"
APP_URL = "https://coomander.com"

# ── D1 (Cloudflare's serverless SQLite) ────────────────────────────────
# `binding = "DB"` is what runtime code looks up via getCloudflareContext()
# in lib/db.ts. database_id is filled in after running:
#   wrangler d1 create coomander-db
[[d1_databases]]
binding = "DB"
database_name = "coomander-db"
database_id = "736e295c-3525-433d-9f5a-9135e0126c59"
migrations_dir = "migrations"

# ── R2 (object storage) ────────────────────────────────────────────────
# `binding = "STORAGE"` is what lib/storage.ts looks up via
# getCloudflareContext() to use the native R2 path (#291). Operator
# setup before first deploy:
#   1. Enable R2 on the account if not already:
#      https://dash.cloudflare.com/?to=/:account/r2 → Enable R2
#   2. `wrangler r2 bucket create coomander-storage`
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "coomander-storage"

# ── Video processor (Cloudflare Containers via separate Worker) ────────
# Lives in node/workers/video-processor and owns the VideoProcessor
# Container Class (ffmpeg + Whisper + Claude vision). Deployed
# independently — see that directory's README. The shared secret used to
# auth the call is stored as the VIDEO_PROCESSOR_SECRET Worker secret on
# this side and SHARED_SECRET on the video processor side.
#
# Temporarily disabled for the initial coomander.com launch: the container
# Worker isn't deployed under its new name yet, and a service binding to a
# nonexistent Worker fails the deploy. video-analysis.ts handles the missing
# binding gracefully (returns null). Re-enable after deploying
# coomander-video-processor (wrangler containers build/push + deploy).
# [[services]]
# binding = "VIDEO_PROCESSOR"
# service = "coomander-video-processor"

# ── Environment-specific overrides ─────────────────────────────────────
# Production deploy will use `wrangler deploy --env production` and override
# the placeholder IDs above. Keeping the top-level entries valid so local
# `opennextjs-cloudflare preview` can boot before the production env is
# created.
[env.production]
name = "coomander"
