# Cloudflare Workers configuration for Coomander (Node.js stack).
#
# Bindings use placeholder IDs — the first real deploy will replace them
# with values from `wrangler d1 create` / `wrangler r2 bucket create`.

name = "coomander"
# Custom Worker entrypoint (#151): wraps .open-next/worker.js to add the
# Coomander cron `scheduled()` handler. See custom-worker.ts.
main = "custom-worker.ts"

# Custom domain — Cloudflare provisions the cert on deploy.
# Requires oqodo.com to be on this Cloudflare account.
routes = [
  { pattern = "coomander.com", custom_domain = true }
]

# 2024-09-23 is the earliest compat date that ships the `nodejs_compat` flag
# behavior the audit (#287) expects. Pin a date older than the SDKs we use
# (Stripe, Resend, Anthropic) all advertise Workers support against.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by `opennextjs-cloudflare build`.
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ── Coomander cron (#151) ──────────────────────────────────────────────────
# IMPORTANT (§9.4 gotcha): this [triggers] table — like every other [table]
# header below — MUST stay BELOW all top-level scalars (name, main,
# compatibility_*, assets, routes). A table header placed above them silently
# absorbs the scalars that follow it. Validate with `wrangler deploy --dry-run`.
#
# Tight-preset cadence (UTC). custom-worker.ts maps each cron expression to a
# slot; the run route fans out to opted-in users and applies each user's nag
# preset (planPing) internally. Times are the tight-preset local intent for US
# Central translated to UTC (morning ~07:00, midday ~13:00, check ~16:00,
# evening ~20:00 CT); they drift ~1h across DST until per-user local scheduling
# lands. Keep in sync with custom-worker.ts CRON_SLOT and scheduling.ts.
# Daily slots + the Sunday-evening weekly review ("0 1 * * 1" = Mon 01:00 UTC =
# Sun 8pm CT; custom-worker.ts routes it to /api/coomander/weekly-review).
#
# The 15-minute expression is the campaign engine's recurring-jobs tick (#597,
# epic #595, sync #222) — custom-worker.ts routes it to
# /api/internal/campaign-cron, which dispatches due scheduled sends (and, once
# the hardening follow-up lands, reconciles stuck sends).
[triggers]
crons = ["0 12 * * *", "0 18 * * *", "0 21 * * *", "0 1 * * *", "0 1 * * 1", "*/15 * * * *"]

# Plain env vars (non-secret). Secrets go through `wrangler secret put`.
# Agents Worker (#192): AGENTS_INTERNAL_SECRET is a SECRET (not listed here) —
# set with `wrangler secret put AGENTS_INTERNAL_SECRET` and it MUST match the
# value set on the coomander-agents Worker (apps/agents). It authenticates the
# agent's server-to-server /api/internal/* calls for scheduled wakes.
[vars]
DATABASE_DRIVER = "d1"
APP_NAME = "Coomander"
BETTER_AUTH_URL = "https://coomander.com"
APP_URL = "https://coomander.com"
# Cloudflare Email Service sender (migrated off Resend). Must be an address on a
# domain onboarded at Cloudflare → Email → Email Sending.
EMAIL_FROM = "Coomander <noreply@coomander.com>"
# Cloudflare Email Sending REST API (transactional email to arbitrary recipients).
# CF_EMAIL_API_TOKEN is a wrangler secret with the "Send Email" permission.
CLOUDFLARE_ACCOUNT_ID = "1ed6d9117731a48060db43fabbf1a468"
# Agents worker chat enabled in prod (#192) — WS streaming + schedule(); JSON chat is the fallback.
FLAG_COOMANDER_AGENTS_CHAT = "true"
# ── AI Gateway (#203) ──────────────────────────────────────────────────
# Route AI through a Cloudflare AI Gateway (e.g. "coomander-gateway") for
# usage/cost analytics + caching. AI_GATEWAY_TOKEN (authenticated gateway) is a
# SECRET: `wrangler secret put AI_GATEWAY_TOKEN`. If AI_GATEWAY_ID is unset / the
# token is missing, AI calls fall back to direct Anthropic — no behavior change.
# Set to the coomander-gateway so the /admin/ai-usage dashboard queries it
# (also needs the CF_ANALYTICS_API_TOKEN secret + the CLOUDFLARE_ACCOUNT_ID
# above, with the "Account Analytics: Read" grant).
AI_GATEWAY_ID = "coomander-gateway"

# ── Workers AI binding (#218) ──────────────────────────────────────────
# The web worker NOW calls Workers AI directly: the Telegram inbound classifier
# (lib/coomander/inbound.ts → inbound-model.ts) dispatches the admin/user-chosen
# model through the multi-provider engine, running open `@cf/...` models via
# createWorkersAI({ binding: env.AI }). Named envs don't inherit bindings, so
# this is redeclared under [env.production.ai] below. In `next dev` there is no
# binding, so Workers-AI choices fall back to Anthropic (handled in inbound-model).
[ai]
binding = "AI"


# ── D1 (Cloudflare's serverless SQLite) ────────────────────────────────
# `binding = "DB"` is what runtime code looks up via getCloudflareContext()
# in lib/db.ts. database_id is filled in after running:
#   wrangler d1 create coomander-db
[[d1_databases]]
binding = "DB"
database_name = "coomander-db"
database_id = "736e295c-3525-433d-9f5a-9135e0126c59"
migrations_dir = "migrations"

# ── R2 (object storage) ────────────────────────────────────────────────
# `binding = "STORAGE"` is what lib/storage.ts looks up via
# getCloudflareContext() to use the native R2 path (#291). Operator
# setup before first deploy:
#   1. Enable R2 on the account if not already:
#      https://dash.cloudflare.com/?to=/:account/r2 → Enable R2
#   2. `wrangler r2 bucket create coomander-storage`
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "coomander-storage"

# ── Campaign send queue (#454, epic #595, sync #222) ───────────────────
# Batched email-campaign send engine (lib/campaign-send.ts). The producer
# binding enqueues one message per recipient batch; the consumer (this same
# Worker — see custom-worker.ts `queue()` → lib/queue-consumer.ts) drains them
# with CF Queue's native retry/backoff, replaying each through
# POST /api/internal/campaign-batch (authenticated with AGENTS_INTERNAL_SECRET,
# NOT a CRON_SECRET). Create the queue before first deploy:
#   wrangler queues create coomander-campaign-send
[[queues.producers]]
binding = "CAMPAIGN_QUEUE"
queue = "coomander-campaign-send"

[[queues.consumers]]
queue = "coomander-campaign-send"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
# RECOMMENDED for prod: a dead-letter queue so a batch that exhausts
# max_retries (e.g. sustained rate-limiting) lands somewhere inspectable
# instead of being silently dropped. A dead-lettered batch is recorded as a
# FAILED batch (lib/queue-consumer.ts detects a queue name ending "-dlq" and
# posts ?dead=1 to /api/internal/campaign-batch) so the campaign finalizes to
# 'failed' (admin can then Resend the unsent recipients) rather than sitting
# in 'sending' forever. To enable:
#   1. wrangler queues create coomander-campaign-send-dlq
#   2. uncomment the dead_letter_queue line below AND the [[queues.consumers]]
#      DLQ block, then redeploy.
# (Left commented so a deploy without the DLQ created doesn't fail. Even
# without it, the reconcile-stuck-campaigns cron backstop still rescues stuck
# campaigns.)
# dead_letter_queue = "coomander-campaign-send-dlq"

# DLQ consumer — handleQueueBatch detects a queue ending in "-dlq" and records
# each message as a failed batch (see lib/queue-consumer.ts). Uncomment with
# the dead_letter_queue line above.
# [[queues.consumers]]
# queue = "coomander-campaign-send-dlq"
# max_batch_size = 10
# max_retries = 3

# ── Video processor (Cloudflare Containers via separate Worker) ────────
# Lives in node/workers/video-processor and owns the VideoProcessor
# Container Class (ffmpeg + Whisper + Claude vision). Deployed
# independently — see that directory's README. The shared secret used to
# auth the call is stored as the VIDEO_PROCESSOR_SECRET Worker secret on
# this side and SHARED_SECRET on the video processor side.
#
[[services]]
binding = "VIDEO_PROCESSOR"
service = "coomander-video-processor"

# ── Realtime channel fan-out (#222) ─────────────────────────────────────
# Direct worker-to-worker call to the agents Worker's generic RealtimeChannel
# DO (apps/agents/src/channel). REQUIRED in prod — see lib/realtime.ts's
# publish() doc comment: a same-zone public fetch to coomander.com loops and
# 522s, so publish() must go through this binding, never plain HTTP, once
# deployed. `service` is the agents worker's `name` from
# apps/agents/wrangler.toml (same script both in dev and `[env.production]`).
[[services]]
binding = "REALTIME"
service = "coomander-agents"

# ── Durable Object cleanup (prod outage fix, 2026-06-18) ───────────────
# A prior out-of-band deploy registered an `AppAgent` Durable Object on THIS
# (web) worker with no local class — AppAgent lives only in the coomander-agents
# worker. The orphaned binding (script_name unset → expects a LOCAL class) made
# the worker fail to instantiate on every request, returning a site-wide 401.
# DO migrations are sticky: simply omitting the binding makes `wrangler deploy`
# refuse with "class removed but no migration"; the class must be explicitly
# deleted. The web app reaches AppAgent cross-worker via the service binding /
# /agents/* route, never as a local DO, so deleting it here is correct.
# The full chain is listed (canonical Cloudflare pattern): v1 created the orphan
# AppAgent class on this worker, v2 deletes it. The remote worker is already at
# v1, so only v2 is actually applied; listing v1 lets the local miniflare
# validator (OpenNext runs getPlatformProxy at deploy) see AppAgent as a
# created-then-deleted class instead of erroring on a "non-existent class".
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppAgent"]

[[migrations]]
tag = "v2"
deleted_classes = ["AppAgent"]

# ── Environment-specific overrides ─────────────────────────────────────
# Production deploy will use `wrangler deploy --env production` and override
# the placeholder IDs above. Keeping the top-level entries valid so local
# `opennextjs-cloudflare preview` can boot before the production env is
# created.
[env.production]
name = "coomander"

# Workers AI binding (#218) — NOT inherited from the top-level env, so redeclare
# it for production. Powers the Telegram inbound classifier's Workers-AI path.
[env.production.ai]
binding = "AI"

# Service bindings — NOT inherited from the top-level env, so redeclare for
# production (see the [[durable_objects.bindings]]/[ai] precedent above and in
# apps/agents/wrangler.toml: named envs never inherit bindings/vars/migrations).
# REALTIME (#222) is the one this environment strictly needs at deploy time —
# lib/realtime.ts's publish() requires the binding in prod (a public-URL fetch
# to the same zone 522s). VIDEO_PROCESSOR is declared top-level only today
# (pre-existing gap, not introduced by #222) — flagged here rather than
# silently carried forward.
[[env.production.services]]
binding = "REALTIME"
service = "coomander-agents"
