# Coomander sidecar agent Worker (Coomander).
#
# Runs as its own small Worker (NOT inside the OpenNext app) so daily dev can
# use `wrangler dev`'s workerd runtime — Durable Objects, alarms, and
# WebSockets all work locally via miniflare while the Next.js dev loop stays
# untouched. Ported from the AppSeed agents epic (template #388) for #192.

name = "coomander-agents"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Where to validate Better Auth sessions in dev: next dev on the shared
# container netns. Prod uses the WEB service binding instead.
WEB_ORIGIN = "http://127.0.0.1:3000"

# AI Gateway routing for the Anthropic provider — usage/cost analytics for the
# agent chatbot (#203, mirrors the app worker). Set CLOUDFLARE_ACCOUNT_ID +
# AI_GATEWAY_ID to route Claude calls through the gateway; leave AI_GATEWAY_ID
# commented (or unset) to go DIRECT to Anthropic. AI_GATEWAY_TOKEN (authenticated
# gateway) is a SECRET via `wrangler secret put`, never a [var].
CLOUDFLARE_ACCOUNT_ID = "1ed6d9117731a48060db43fabbf1a468"
# AI_GATEWAY_ID = "coomander-gateway"

# NOTE: no top-level [ai] binding (#222, dropped 2026-06-26 upstream). A
# Workers-AI binding has no local emulation, so its presence forces
# `wrangler dev` into REMOTE mode — every WS connect tunnels the Better Auth
# session check back to the local web app over Cloudflare's network, adding
# seconds per connect and occasionally dropping, and it requires a
# CLOUDFLARE_API_TOKEN just to boot dev. Dropping it here does not change dev
# chat behavior: resolveAgentModel() (chat-model.ts) already falls back to the
# default Claude/BYOK path (ANTHROPIC_API_KEY) whenever env.AI is absent. To
# exercise open Workers-AI models locally, temporarily re-add this binding
# (and accept remote dev mode). [env.production.ai] below is UNCHANGED — prod
# runs natively (no tunnel) and keeps its own binding.

# Secrets (NOT declared here): ANTHROPIC_API_KEY (chat) and
# AGENTS_INTERNAL_SECRET (server-to-server calls for scheduled wakes) come from
# .dev.vars / apps/web/.env.local in dev and `wrangler secret put <NAME>` in
# prod. See .dev.vars.example.

# Each Agent class is a Durable Object: one binding + one SQLite-backed
# migration entry per class. Never edit an existing migration tag — add a new
# one when introducing another agent class.
[[durable_objects.bindings]]
name = "AppAgent"
class_name = "AppAgent"

# Generic per-entity realtime fan-out channel (#222, ported from the AppSeed
# realtime epic). One DO instance per "<type>:<id>" channel address; any
# feature can publish to it without owning DO code. See src/channel/.
[[durable_objects.bindings]]
name = "REALTIME_CHANNEL"
class_name = "RealtimeChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeChannel"]

# ── Production (`wrangler deploy --env production`) ───────────────────────────
# Daily dev uses the top-level env above (`wrangler dev` — no route, no service
# binding, WEB_ORIGIN → next dev). Production is its own env because a few things
# differ, and wrangler named envs do NOT inherit bindings/vars/migrations from
# the top level — so the DO binding + migration are redeclared below.
#
# DEPLOY IS OPERATOR-GATED (#192): the production route below is COMMENTED so
# even an accidental `wrangler deploy --env production` takes no traffic.
# To go live: uncomment the route, set the two secrets
# (`wrangler secret put ANTHROPIC_API_KEY --env production`,
#  `wrangler secret put AGENTS_INTERNAL_SECRET --env production` — the latter
# must match the app worker's value), then `npm run deploy:agents`.
[env.production]
name = "coomander-agents"

# Same Cloudflare zone as the OpenNext app worker so the Better Auth session
# cookie flows. These pattern routes are more specific than the app worker's
# custom-domain route on the same host, so Cloudflare routes `/agents/*` and
# `/realtime/*` here and everything else to the app worker (`coomander`).
# `/realtime/*` (#222) carries the generic RealtimeChannel DO's WebSocket
# upgrades (browser) and the internal publish RPC (the web app's REALTIME
# service binding routes by pathname, not URL host, but the pattern still must
# exist for this Worker to own the route table entry).
# Uncomment to go live:
routes = [
  { pattern = "coomander.com/agents/*", zone_name = "coomander.com" },
  { pattern = "coomander.com/realtime/*", zone_name = "coomander.com" },
]

[env.production.vars]
# In prod the agent reaches the app worker over the WEB service binding below
# (internal — no public hop). WEB_ORIGIN still supplies the request URL so the
# Host/origin is correct for Better Auth; point it at the app's public origin.
WEB_ORIGIN = "https://coomander.com"
# AI Gateway routing — usage/cost analytics for the agent chatbot (#203, mirrors
# the app worker). AI_GATEWAY_TOKEN (authenticated gateway) is a SECRET set via
# `wrangler secret put AI_GATEWAY_TOKEN --env production`. The coomander-gateway
# (unauthenticated, caching off) routes Claude through Cloudflare AI Gateway for
# usage/cost analytics (#203). Dev (top-level [vars]) stays direct.
CLOUDFLARE_ACCOUNT_ID = "1ed6d9117731a48060db43fabbf1a468"
AI_GATEWAY_ID = "coomander-gateway"

# Service binding agents → app worker. Session validation + persistence + the
# internal-secret routes go through this, never a public HTTP round-trip.
# `service` is the app worker's `name` from apps/web/wrangler.toml.
[[env.production.services]]
binding = "WEB"
service = "coomander"

# NOT inherited from the top-level env — redeclare for production.
[[env.production.durable_objects.bindings]]
name = "AppAgent"
class_name = "AppAgent"

[[env.production.durable_objects.bindings]]
name = "REALTIME_CHANNEL"
class_name = "RealtimeChannel"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["AppAgent"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeChannel"]

# NOT inherited from the top-level env — redeclare the Workers AI binding for
# production (named envs don't inherit bindings/vars/migrations).
[env.production.ai]
binding = "AI"
